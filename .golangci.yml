version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
#    - revive
    - gosec
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - gocyclo
    - funlen
    - dupl
    - goconst
  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - gosec
          - revive
          - goconst
  settings:
    revive:
      rules:
        - name: exported
          arguments: [false]
    gocyclo:
      min-complexity: 15
    funlen:
      lines: 80
      statements: 50
    dupl:
      threshold: 100
    goconst:
      min-len: 3
      min-occurrences: 3
      # cobra subcommand names, JSON/protocol keys, argv tokens and keycode
      # table entries read better as literals than as constants
      ignore-string-values:
        - '^(list|status|start|running)$'
        - '^(message|data|method|params|url|expression|text|format|deviceId|bundleId|isolateId|objectId)$'
        - '^(command|control|option|Switch)$'
        - '^(shell|simctl)$'
        - '^KEYCODE_'
    gosec:
      excludes:
        - G204 # Subprocess launched with variable
    errcheck:
      check-type-assertions: true
      check-blank: false

issues:
  max-issues-per-linter: 0
  max-same-issues: 0 
