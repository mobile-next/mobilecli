name: Build and Release
permissions:
  contents: write
on:
  push:
    branches: [ "main" ]
    tags:
      - "*.*.*"
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'

jobs:

  build_linux_agents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install Android NDK and build tools
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
          "ndk;29.0.13113456" \
          "build-tools;36.0.0" \
          "platforms;android-35"
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Build Android agents
      run: make -C agents/android all
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: Upload Android agent binaries
      uses: actions/upload-artifact@v6
      with:
        name: android-agents
        path: |
          agents/android/mobilecli.so
          agents/android/mobilecli.dex
        retention-days: 1

  build_ios_agents:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Build iOS agents
      run: make -C agents/ios all

    - name: Upload iOS agent binaries
      uses: actions/upload-artifact@v6
      with:
        name: ios-agents
        path: |
          agents/ios/agent-sim.dylib
        retention-days: 1

  test:
    runs-on: macos-latest
    timeout-minutes: 15
    needs: [build_linux_agents, build_ios_agents]
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Download Android agent binaries
      uses: actions/download-artifact@v6
      with:
        name: android-agents
        path: agents/android/

    - name: Download iOS agent binaries
      uses: actions/download-artifact@v6
      with:
        name: ios-agents
        path: agents/ios/

    - name: Run Unit Tests
      run: |
        CGO_ENABLED=0 go build -ldflags="-s -w"
        go test ./... -v -race

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Check formatting
      run: |
        go fmt ./...
        git diff --exit-code

    - name: Lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.13.1
      continue-on-error: true

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Security scan
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck -show verbose ./... || true

  build_on_macos:

    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: [build_linux_agents, build_ios_agents, test, lint, security]
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Download Android agent binaries
      uses: actions/download-artifact@v6
      with:
        name: android-agents
        path: agents/android/

    - name: Download iOS agent binaries
      uses: actions/download-artifact@v6
      with:
        name: ios-agents
        path: agents/ios/

    - name: Install dependencies
      run: |
        go install golang.org/x/tools/cmd/goimports@latest

    - name: Set version
      if: github.ref_type == 'tag'
      run: |
        if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Invalid release tag format: $GITHUB_REF_NAME"
          exit 1
        fi
        sed -i '' 's/Version = \"dev\"/Version = \"'"$GITHUB_REF_NAME"'\"/' server/server.go

    - name: Build
      run: |
        GOARCH=arm64 go build -ldflags="-s -w" -o mobilecli-darwin-arm64
        GOARCH=amd64 go build -ldflags="-s -w" -o mobilecli-darwin-amd64
        ./mobilecli-darwin-arm64 --version

    - name: Upload macos build artifact
      uses: actions/upload-artifact@v6
      with:
        name: macos-build
        path: |
          mobilecli-darwin-arm64
          mobilecli-darwin-amd64
        retention-days: 1
        overwrite: true

  build_on_linux:

    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: [build_linux_agents, build_ios_agents, test, lint, security]
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Download Android agent binaries
      uses: actions/download-artifact@v6
      with:
        name: android-agents
        path: agents/android/

    - name: Download iOS agent binaries
      uses: actions/download-artifact@v6
      with:
        name: ios-agents
        path: agents/ios/

    - name: Install dependencies
      run: |
        go install golang.org/x/tools/cmd/goimports@latest
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

    - name: Set version
      if: github.ref_type == 'tag'
      run: |
        if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Invalid release tag format: $GITHUB_REF_NAME"
          exit 1
        fi
        sed -i 's/Version = \"dev\"/Version = \"'"$GITHUB_REF_NAME"'\"/' server/server.go

    - name: Build
      run: |
        CGO_ENABLED=0 GOARCH=arm64 go build -ldflags="-s -w" -o mobilecli-linux-arm64
        CGO_ENABLED=0 GOARCH=amd64 go build -ldflags="-s -w" -o mobilecli-linux-amd64
        ./mobilecli-linux-amd64 --version

    - name: Upload macos build artifact
      uses: actions/upload-artifact@v6
      with:
        name: linux-build
        path: |
          mobilecli-linux-arm64
          mobilecli-linux-amd64
        retention-days: 1
        overwrite: true

  build_on_windows:

    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: [build_linux_agents, build_ios_agents, test, lint, security]
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Download Android agent binaries
      uses: actions/download-artifact@v6
      with:
        name: android-agents
        path: agents/android/

    - name: Download iOS agent binaries
      uses: actions/download-artifact@v6
      with:
        name: ios-agents
        path: agents/ios/

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Set version
      if: github.ref_type == 'tag'
      run: |
        if ($env:GITHUB_REF_NAME -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
          Write-Error "Invalid release tag format: $env:GITHUB_REF_NAME"
          exit 1
        }
        sed -i ('s/Version = \"dev\"/Version = \"' + $env:GITHUB_REF_NAME + '\"/') server/server.go

    - name: Build
      run: |
        $env:GOARCH="amd64"; go build -ldflags="-s -w" -o mobilecli-windows-amd64.exe
        $env:GOARCH="arm64"; go build -ldflags="-s -w" -o mobilecli-windows-arm64.exe

    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: windows-build
        path: |
          mobilecli-windows-amd64.exe
          mobilecli-windows-arm64.exe

  e2e_test:
    runs-on: self-hosted
    timeout-minutes: 10
    needs: [build_on_macos]

    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Download macos build
      uses: actions/download-artifact@v6
      with:
        name: macos-build
        path: .

    - name: Make mobilecli executable
      run: |
        mv mobilecli-darwin-arm64 mobilecli
        chmod +x mobilecli

    - name: npm install
      run: |
        cd test
        npm install --ignore-scripts

    - name: run tests
      run:
        make test-e2e

  publish:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write  # Required for npm trusted publishing with OIDC
      contents: write
    needs: [build_on_windows, build_on_linux, build_on_macos, e2e_test]
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - uses: actions/setup-node@v5
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - name: Download darwin build
      uses: actions/download-artifact@v6
      with:
        name: macos-build
        path: mobilecli-darwin

    - name: Download linux build
      uses: actions/download-artifact@v6
      with:
        name: linux-build
        path: mobilecli-linux

    - name: Download windows build
      uses: actions/download-artifact@v6
      with:
        name: windows-build
        path: mobilecli-windows

    - name: Zip builds
      run: |
        if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Invalid release tag format: $GITHUB_REF_NAME"
          exit 1
        fi

        mkdir dist
        cd dist
        # macos-arm64
        cp ../mobilecli-darwin/mobilecli-darwin-arm64 mobilecli
        zip -9 "../mobilecli-$GITHUB_REF_NAME-macos-arm64.zip" mobilecli
        rm -f mobilecli

        # macos-amd64
        cp ../mobilecli-darwin/mobilecli-darwin-amd64 mobilecli
        zip -9 "../mobilecli-$GITHUB_REF_NAME-macos-amd64.zip" mobilecli
        rm -f mobilecli

        # linux-amd64
        cp ../mobilecli-linux/mobilecli-linux-amd64 mobilecli
        zip -9 "../mobilecli-$GITHUB_REF_NAME-linux-amd64.zip" mobilecli
        rm -f mobilecli

        # linux-arm64
        cp ../mobilecli-linux/mobilecli-linux-arm64 mobilecli
        zip -9 "../mobilecli-$GITHUB_REF_NAME-linux-arm64.zip" mobilecli
        rm -f mobilecli

        # windows-amd64
        cp ../mobilecli-windows/mobilecli-windows-amd64.exe mobilecli.exe
        zip -9 "../mobilecli-$GITHUB_REF_NAME-windows-amd64.zip" mobilecli.exe
        rm -f mobilecli.exe

        # windows-arm64
        cp ../mobilecli-windows/mobilecli-windows-arm64.exe mobilecli.exe
        zip -9 "../mobilecli-$GITHUB_REF_NAME-windows-arm64.zip" mobilecli.exe
        rm -f mobilecli.exe
        cd ..

        ls -l *.zip
        rm -rf dist

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      with:
        name: Version ${{ github.ref_name }}
        files: |
          mobilecli-*.zip

    - name: Publish
      run: |
        # prepare binaries for distribution
        mv ./mobilecli-darwin/mobilecli-darwin-arm64 publish/npm/bin
        mv ./mobilecli-darwin/mobilecli-darwin-amd64 publish/npm/bin
        mv ./mobilecli-linux/mobilecli-linux-amd64 publish/npm/bin
        mv ./mobilecli-linux/mobilecli-linux-arm64 publish/npm/bin
        mv ./mobilecli-windows/mobilecli-windows-amd64.exe publish/npm/bin
        mv ./mobilecli-windows/mobilecli-windows-arm64.exe publish/npm/bin
        chmod +x publish/npm/bin/*
        # copy README.md
        cp README.md publish/npm
        # publish to npm
        cd publish/npm
        npm version "$GITHUB_REF_NAME" --no-git-tag-version
        npm install --ignore-scripts
        npm publish --access public --provenance
